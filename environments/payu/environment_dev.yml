name: payu-dev
channels:
  - accessnri
  - conda-forge
  - nodefaults
dependencies:
  - python=3.14
  - f90nml
  - nco
  - pytest
  - xarray
  - mule
  - um2nc<2
  - accessnri::yamanifest
  - netcdf4=*=nompi_*
  - experiment-generator
  - experiment-runner
  - mnctools
  - addmeta
  - hpcpy==0.9.0 # Temp pin - https://github.com/payu-org/payu/issues/900
  - pip:
    - git+https://github.com/payu-org/payu.git@master
