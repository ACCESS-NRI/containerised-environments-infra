deployment:
  - '{infrastructure,environments,defaults,.github/actions}/**'
  - '!infrastructure/jinja2_templates/**'
  - '!defaults/container/**'
  - '.github/workflows/deploy_module.yml'
  - '.github/workflows/deploy_to_staging.yml'
  - '!.github/actions/set_message/**'
  - 'deployment_filters.yml'
containers:
  - 'defaults/container/**'
  - 'environments/*/overrides/container/**'
dev_envs: &dev_envs
  - 'environments/*/environment_dev.yml'
stable_envs:
  - 'environments/**'
  - '!*dev_envs'