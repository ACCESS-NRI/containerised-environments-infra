name: Release STABLE module to PRODUCTION
description: |
  This workflow deploys STABLE modules to PRODUCTION.
  It is used to release the modules that will be used in production by the end users
  on the HPC systems.
on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Name of the environment to deploy. Must match a subfolder name under this repository's `environments/` directory."
        required: true
        type: string
      version:
        description: "Version to be deployed (e.g. 1.0.0)"
        required: true
        type: string

jobs:
  log_information:
    runs-on: ubuntu-latest
    env:
      ENVIRONMENT: ${{ inputs.environment }}
      VERSION: ${{ inputs.version }}
    steps:
      - name: Log information
        run: |
          echo '::notice::Workflow run from branch: ${{ github.ref_name }}'
          echo "::notice::Module to be released: $ENVIRONMENT/$VERSION"

  deploy:
    uses: ./.github/workflows/deploy_module.yml
    with:
      environment: ${{ inputs.environment }}
      version: ${{ inputs.version }}
      staging: true
      production: true
      is_stable: true
    secrets: inherit

  github_release:
    runs-on: ubuntu-latest
    needs: deploy
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.REPO_CONTENT_WRITE_TOKEN }}

      - name: Download deployment info JSON artifact
        uses: actions/download-artifact@v8
        id: download-artifact
        with:
          pattern: deployment_info_*
          path: ${{github.workspace}}/downloaded_artifact
      
      - name: Get info from deployment info JSON
        id: get-info
        env:
          DOWNLOAD_PATH: ${{steps.download-artifact.outputs.download-path}}
          SAFE_REGEX: ${{ vars.SAFE_REGEX }}
        run: |
          deployment_info_json_path=$(find "$DOWNLOAD_PATH" -name 'deployment_info_*.json' | head -n 1)
          [[ -f "$deployment_info_json_path" ]] || { echo "::error::No deployment info JSON found."; exit 1; }
          get() { jq -r "[.deployments[0].$1] | .[0] // empty" "$deployment_info_json_path"; }
          module_name=$(get module_name)
          module_version=$(get module_version)
          commit_sha=$(get commit_sha)
          hpc_name=$(get hpc_name)
          for v in "$module_name" "$module_version" "$hpc_name"; do
            [[ "$v" =~ $SAFE_REGEX ]] || { echo "::error::Invalid value in deployment info JSON."; exit 1; }
          done
          [[ "$commit_sha" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::Invalid commit SHA in deployment info JSON."; exit 1; }
          {
            echo "module_name=$module_name"
            echo "module_version=$module_version"
            echo "commit_sha=$commit_sha"
            echo "hpc_name=$hpc_name"
            echo "deployment_info_json_path=$deployment_info_json_path"
          } >> "$GITHUB_OUTPUT"

      # To sign commits and tags
      - name: Import GPG settings
        uses: crazy-max/ghaction-import-gpg@2dc316deee8e90f13e1a351ab510b4d5bc0c82cd  # v7.0.0
        with:
          gpg_private_key: ${{ secrets.GH_ACTIONS_BOT_GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GH_ACTIONS_BOT_GPG_PASSPHRASE }}
          git_config_global: true
          git_committer_name: ${{ vars.GH_ACTIONS_BOT_GIT_USER_NAME }}
          git_committer_email: ${{ vars.GH_ACTIONS_BOT_GIT_USER_EMAIL }}
          git_user_signingkey: true
          git_commit_gpgsign: true
          git_tag_gpgsign: true

      - name: Create tag
        id: create-tag
        env:
          MODULE_NAME_VERSION: ${{steps.get-info.outputs.module_name}}/${{steps.get-info.outputs.module_version}}
          HPC_NAME: ${{steps.get-info.outputs.hpc_name}}
          COMMIT_SHA: ${{steps.get-info.outputs.commit_sha}}
          WORKFLOW_NAME: ${{ github.workflow }}
        run: |
          tag_name="${HPC_NAME}_${MODULE_NAME_VERSION}"
          tag_message="Released $MODULE_NAME_VERSION module on $HPC_NAME. "
          tag_message+="Tag automatically created by the $WORKFLOW_NAME workflow."
          git config --list
          git tag "$tag_name" "$COMMIT_SHA" -m "$tag_message"
          git push origin "$tag_name"
          echo "tag_name=$tag_name" >> $GITHUB_OUTPUT

      - name: Set gh-release message
        id: set-gh-release-message
        uses: ./.github/actions/set_message
        with:
          message-type: gh-release
          data-file: "${{steps.get-info.outputs.deployment_info_json_path}}"
        
      - name: Create GitHub Release
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b #v3.1.0
        with:
            tag_name: ${{steps.create-tag.outputs.tag_name}}
            name: ${{steps.get-info.outputs.module_name}}/${{steps.get-info.outputs.module_version}} on ${{steps.get-info.outputs.hpc_name}}
            generate_release_notes: false
            fail_on_unmatched_files: true
            files: ${{steps.get-info.outputs.deployment_info_json_path}}
            body_path: "${{ steps.set-gh-release-message.outputs.message-file-path }}"